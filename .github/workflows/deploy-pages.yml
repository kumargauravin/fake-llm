name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Build mock-llm package
        working-directory: packages/mock-llm
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install demo app dependencies
        working-directory: apps/demo-nextjs
        run: |
          npm install --legacy-peer-deps --no-package-lock
          npm install --legacy-peer-deps --no-package-lock @nice-tools/mock-llm@latest

      - name: Build & Export demo app
        working-directory: apps/demo-nextjs
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo-nextjs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
