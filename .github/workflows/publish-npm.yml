name: Publish @nice-tools/mock-llm to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@nice-tools'

      - name: Install dependencies
        working-directory: packages/mock-llm
        run: npm install

      - name: Build package
        working-directory: packages/mock-llm
        run: npm run build

      - name: Publish to npm
        working-directory: packages/mock-llm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Trigger GitHub Pages redeploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main'
            });
            console.log('GitHub Pages redeploy triggered successfully.');
